<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="フォト">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>フォト</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         font-family: -apple-system, "Hiragino Sans", sans-serif; }
  #img { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  body.contain #img { object-fit: contain; }
  #empty { position: fixed; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 14px; color: #aaa; font-size: 15px; }
  button { font: inherit; font-size: 16px; color: #fff; background: rgba(255,255,255,.18);
           border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 12px 24px;
           -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #bar { position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom));
         display: flex; justify-content: center; gap: 10px;
         opacity: 0; pointer-events: none; transition: opacity .25s; }
  #bar.show { opacity: 1; pointer-events: auto; }
  input { display: none; }
</style>
</head>
<body>
<img id="img" alt="">
<div id="empty">
  <div>表示する画像を選んでください</div>
  <button id="pick1">画像を選ぶ</button>
</div>
<div id="bar">
  <button id="pick2">画像を変える</button>
  <button id="fit">全体を表示</button>
</div>
<input type="file" id="file" accept="image/*">
<script>
const img = document.getElementById('img'), empty = document.getElementById('empty'),
      bar = document.getElementById('bar'), file = document.getElementById('file'),
      fit = document.getElementById('fit');

// 画像はこの端末の中（IndexedDB）にだけ保存する
function db() {
  return new Promise((ok, ng) => {
    const r = indexedDB.open('photo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
  });
}
async function put(k, v) {
  const d = await db();
  return new Promise((ok, ng) => { const t = d.transaction('kv', 'readwrite');
    t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = () => ng(t.error); });
}
async function get(k) {
  const d = await db();
  return new Promise((ok, ng) => { const r = d.transaction('kv').objectStore('kv').get(k);
    r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
}

function show(blob) {
  if (img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(blob);
  img.style.display = 'block'; empty.style.display = 'none';
}
function setFit(contain) {
  document.body.classList.toggle('contain', contain);
  fit.textContent = contain ? '画面いっぱい' : '全体を表示';
}

let timer;
function flashBar() {
  bar.classList.add('show'); clearTimeout(timer);
  timer = setTimeout(() => bar.classList.remove('show'), 3000);
}

document.getElementById('pick1').onclick = () => file.click();
document.getElementById('pick2').onclick = () => file.click();
fit.onclick = () => { const c = !document.body.classList.contains('contain'); setFit(c); put('contain', c); flashBar(); };
img.onclick = flashBar;
file.onchange = async () => {
  const f = file.files[0]; if (!f) return;
  show(f); await put('image', f); file.value = '';
};

(async () => {
  try {
    setFit(!!(await get('contain')));
    const b = await get('image'); if (b) show(b);
  } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
