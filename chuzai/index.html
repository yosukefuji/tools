<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="波留島駐在所">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3F8190">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>波留島駐在所事件簿</title>
</head>
<body>
<style>
/* 色：淡い海のガラス色。主役は --teal の1色だけ。ダークモードは作らない */
:root{--cwh:clamp(112px,25vh,190px);
  --bg:#f3f7f6; --card:#ffffff; --ink:#24313a; --muted:#6b7c85;
  --line:#dce7e7; --teal:#3F8190; --teal-soft:#e3f0f1; --teal-deep:#2d6270;
  --accent:#d9805f; --accent-soft:#fbeee8; --ok:#3b8a68; --ok-soft:#e5f3ec;
  --field:#eaf1f1;
  --body:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","BIZ UDPMincho","MS PMincho",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;
  word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
.nw{white-space:nowrap}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}

/* 上の帯（時計とかぶらない） */
.band{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--teal);color:#fff;
  padding:calc(6px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.band-in{max-width:640px;margin:0 auto}
.band-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.band b{font-size:18px;letter-spacing:.02em}
.band small{font-size:13px;opacity:.92}
.bar{height:14px;background:rgba(255,255,255,.3);border-radius:7px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:7px;transition:width .5s,background .5s}
.band.warn{background:#c9714f}
.band.hot{background:#b5452f}
.band.hot .bar i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.band .big{font-size:22px;font-weight:700;line-height:1.3}
.band .big small{font-size:13px;font-weight:400;margin-left:6px}
.band.plain .bar,.band.plain small{display:none}

.wrap{max-width:640px;margin:0 auto;
  padding:calc(var(--bh,64px) + 12px) max(16px,env(safe-area-inset-left,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap.nonav{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

h1{font-size:26px;line-height:1.4;margin:0 0 6px}
h2{font-size:14px;margin:22px 0 10px;color:var(--teal-deep);letter-spacing:.1em}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card.tap{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.card.tap:active{background:var(--teal-soft)}
.mark{flex:none;width:44px;height:44px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);
  display:grid;place-items:center;font-weight:700;font-size:18px}
.card .t{font-weight:700;line-height:1.4}
.card .s{font-size:14px;color:var(--muted);line-height:1.5}
.chev{margin-left:auto;color:var(--muted);font-size:22px}

.btn{display:block;width:100%;text-align:center;background:var(--teal);color:#fff;font-weight:700;
  padding:13px 16px;border-radius:12px}
.btn:active{background:var(--teal-deep)}
.btn.ghost{background:var(--teal-soft);color:var(--teal-deep)}
.btn.warm{background:var(--accent)}
.btn[disabled]{opacity:.45}
.btn small{font-weight:400;opacity:.85;margin-left:6px}
.back{color:var(--teal-deep);font-weight:700;margin:0 0 10px;display:inline-block;padding:4px 0}

.story p{margin-bottom:14px}
.said{background:var(--teal-soft);border-radius:12px;padding:12px 14px;margin:10px 0}
.said p{margin:0 0 8px}.said p:last-child{margin:0}
.item{margin-bottom:10px}
.item .done{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.item .done .h{font-size:13px;color:var(--ok);font-weight:700;margin-bottom:4px}
.got{font-size:13px;color:var(--teal-deep);font-weight:700;margin-top:6px}

/* ノート */
.note{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
  border-radius:14px;padding:10px 14px;margin-bottom:8px}
.note .t{font-weight:700;font-size:16px;line-height:1.4}
.note .b{font-size:15px;color:var(--muted);line-height:1.6;margin-top:2px}
.note.sel{border-color:var(--accent);background:var(--accent-soft)}
.note.ins{background:var(--teal-soft);border-color:#bddadd}
.note.ins.sel{border-color:var(--accent);background:var(--accent-soft)}
.joinbar{position:sticky;top:var(--bh,64px);z-index:5;background:var(--bg);padding:6px 0 8px}
.joinbar .hint{font-size:14px;color:var(--muted);margin-bottom:6px}

/* 推理 */
.q{border-radius:14px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);padding:14px 16px}
.q.solved{background:var(--ok-soft);border-color:#bfe0cf}
.q .qt{font-weight:700;display:flex;gap:8px;align-items:center}
.stamp{color:var(--ok);font-weight:700}
.choice{display:block;width:100%;text-align:left;background:var(--field);border-radius:11px;padding:11px 14px;margin-top:8px;font-weight:600}
.choice:active{background:var(--teal-soft)}
.choice.bad{background:var(--accent-soft);color:#8f4a30}
.why{font-size:15px;color:#8f4a30;margin:6px 2px 0}
.lock{color:var(--muted);font-size:15px;margin-top:6px}
.hintbox{background:var(--accent-soft);border-radius:11px;padding:10px 14px;margin-top:10px;font-size:15px}
.link{color:var(--teal-deep);font-weight:700;font-size:15px;padding:8px 0;display:inline-block}

/* 下のナビ */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:flex}
.nav button{flex:1;padding:10px 0 9px;text-align:center;font-size:13px;color:var(--muted);font-weight:700;position:relative}
.nav button b{display:block;font-size:20px;line-height:1.2;height:24px}
.nav button b svg{display:block;margin:0 auto}
.nav button.on{color:var(--teal-deep)}
.nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.badge{position:absolute;top:4px;left:calc(50% + 10px);background:var(--accent);color:#fff;font-size:11px;
  min-width:18px;height:18px;line-height:18px;border-radius:9px;padding:0 5px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;line-height:1.5;
  opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.over{position:fixed;inset:0;background:rgba(36,49,58,.55);z-index:40;display:grid;place-items:center;padding:24px}
.over .box{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}
.stars{font-size:30px;color:var(--accent);letter-spacing:.1em;text-align:center}
.note:active,.btn:active,.choice:active{transform:scale(.97)}
.note,.btn,.choice{transition:transform .08s,background .15s}
.note.pend{animation:pulse 0.5s infinite}
.note.shown{opacity:.7}
.react{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;white-space:pre-line;animation:pop .35s}
.react.hit{background:var(--accent-soft);border-color:var(--accent)}
@keyframes pop{0%{transform:translateY(8px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--teal-soft);color:var(--teal-deep);border-radius:6px;padding:0 8px;margin-right:6px}

/* ===== 嵐の夜の見た目（v2） ===== */
html{background:#141f2a}
body{background:transparent}
#sky{position:fixed;inset:0;z-index:-1;background:linear-gradient(#141f2a,#25394a);transition:background 1.5s}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.tree{position:fixed;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:0;width:110px;height:200px;opacity:.55;pointer-events:none;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
.tree.l{left:-18px}.tree.r{right:-18px;animation-delay:-1.7s;transform:scaleX(-1)}
@keyframes sway{0%,100%{rotate:-1.2deg}50%{rotate:1.6deg}}
.wrap{position:relative;z-index:1}
/* 背景の上にそのまま置く文字は明るく */
.wrap>h1,.wrap>h2,.wrap>.muted,.wrap>.back,.wrap>.story,.wrap>.phead,.joinbar .hint{color:#e8f0f4}
.wrap>h2{color:#9fd0d8}
.wrap>.muted,.joinbar .hint{color:#aebfc9}
.joinbar{background:rgba(22,34,45,.93);border-radius:0 0 12px 12px;padding:6px 8px 8px;margin:0 -8px}
.joinbar .why{color:#ffbfa6}
.card,.note,.q,.item .done,.said,.react,.choice,.hintbox,.over .box{color:var(--ink)}
.card,.note,.q{box-shadow:0 2px 10px rgba(0,0,0,.18)}
.nav{background:rgba(20,31,42,.94);border-top:1px solid rgba(255,255,255,.12)}
.nav button{color:#9db0bb}
.nav button.on{color:#fff}
.nav button.on::before{background:#7fc4cf}
.band{box-shadow:0 2px 10px rgba(0,0,0,.25)}
.wrap>.stars{filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.wrap>.card .s{color:var(--muted)}

/* 人物のシルエット・場所の絵 */
.av{flex:none;width:58px;height:58px;border-radius:14px;overflow:hidden;display:block}
.av svg,.thumb svg{display:block;width:100%;height:100%}
.thumb{flex:none;width:84px;height:58px;border-radius:12px;overflow:hidden}
.banner.fadein{animation:bfade .7s ease-out}
@keyframes bfade{from{opacity:0}to{opacity:1}}
.prolog{position:fixed;inset:0;z-index:60;background:rgba(10,18,26,.94);color:#fff;overflow:auto;padding:16px 16px 40px}
.prolog .x{position:sticky;top:0;float:right;background:linear-gradient(#5d7d94,#3f5c72);color:#f4f8fa;border:1px solid rgba(255,255,255,.22);font-weight:800;border-radius:8px;padding:6px 16px}
.prolog p{margin:0 0 14px;line-height:1.8;font-size:18px;max-width:640px;margin-left:auto;margin-right:auto}
.prolog b{display:block;color:#9fc3d4;font-size:14px;letter-spacing:.08em;margin-bottom:2px}
.prolog .nr{color:#cfd9de}
.banner{border-radius:14px;overflow:hidden;margin:4px 0 12px;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.banner svg{display:block;width:100%;height:auto}
.phead{margin-bottom:12px}
.phead .nm{font-weight:700;font-size:22px;line-height:1.3}
.flash{animation:fl .5s}
@keyframes fl{0%{filter:brightness(1.8)}100%{filter:none}}
.artimg{display:block;width:100%;height:100%;object-fit:cover}
.banner .artimg{height:auto}
@media (prefers-reduced-motion:reduce){.tree{animation:none}.note.pend,.band.hot .bar i{animation:none}}

/* ===== A版／B版の切り替え ===== */
#artsw{position:fixed;right:10px;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:25;background:rgba(20,31,42,.82);color:#e8f0f4;
  border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:700;line-height:1.5;opacity:.85}
#artsw b{color:#ffd9a8}
#stormB{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}
html[data-storm="b"] #stormB{display:block}
html[data-storm="b"] .tree{display:none}
#stormB .rain{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
#stormB .rain svg,#stormB .waves svg,#stormB .bolt svg{display:block;width:100%;height:100%}
#stormB .waves{position:absolute;left:0;right:0;bottom:52px;height:130px;opacity:.9;transition:opacity 1.5s}
#stormB .bolt{position:absolute;top:0;width:90px;height:330px;opacity:0;transition:opacity .08s}
#stormB .bolt.on{opacity:.9}
#stormB .tr{position:absolute;bottom:52px;width:100px;height:182px;opacity:.55}
#stormB .tr.l{left:-14px}#stormB .tr.r{right:-14px;transform:scaleX(-1)}
#stormB .tr svg{display:block;width:100%;height:100%}

/* ===== タイトル画面（背景の絵＋暗い重ね） ===== */
#hero{position:fixed;inset:0;z-index:-1;display:none;background:#0d1620 center 40%/cover no-repeat}
#hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(8,14,22,.72),rgba(8,14,22,.28) 32%,rgba(8,14,22,.35) 55%,rgba(8,14,22,.86))}
html[data-screen=home] #hero{display:block}
html[data-screen=home] #sky,html[data-screen=home] .tree,html[data-screen=home] .band{display:none}
html[data-screen=home] #fx{opacity:.4}
/* 事件前（intro）と事件後（end）＝晴れた島／事件中（play）＝嵐の島 */
html[data-screen=play] #hero,html[data-screen=intro] #hero,html[data-screen=end] #hero,html[data-screen=cont] #hero,html[data-screen=settings] #hero{display:block}
html[data-screen=play] #sky,html[data-screen=play] .tree,html[data-screen=end] #sky,html[data-screen=end] .tree,html[data-screen=cont] #sky,html[data-screen=cont] .tree,html[data-screen=settings] #sky,html[data-screen=settings] .tree{display:none}
html[data-screen=cont] #hero::after,html[data-screen=settings] #hero::after{background:linear-gradient(rgba(8,14,22,.72),rgba(8,14,22,.62))}
html[data-screen=intro] #hero{display:block}
html[data-screen=play] #hero::after{background:linear-gradient(rgba(8,14,22,.66),rgba(8,14,22,.52) 40%,rgba(8,14,22,.7))}
html[data-screen=end] #hero::after{background:linear-gradient(rgba(10,24,40,.30),rgba(10,24,40,.50))}
html[data-screen=intro] #hero::after{background:linear-gradient(rgba(8,14,22,.7),rgba(8,14,22,.6))}
html[data-screen=home] #artsw{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));opacity:.6}
.home{min-height:calc(100svh - 70px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.home .ttl{padding-top:6vh;text-align:center}
.home .ttl small{display:block;color:#a9c3d1;letter-spacing:.3em;font-size:12px;margin-bottom:8px}
.home .ttl h1{font-size:clamp(26px,8.2vw,44px);line-height:1.25;margin:0;letter-spacing:.04em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.home .ttl p{margin:14px 0 0;color:#d6e4ec;font-size:16px;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.home .lead{color:#a9c3d1;font-size:13px;letter-spacing:.1em;margin:0 0 8px}
.home .card{background:rgba(14,24,34,.72);border-color:rgba(255,255,255,.16);color:#eef4f7;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.home .card .s{color:#b4c7d1}
.home .card .mark{background:rgba(255,255,255,.14);color:#fff}
.home .card .chev{color:#b4c7d1}
.home .card .stamp{color:#8fe0b4}
.menu{font-size:24px;line-height:1;color:#fff;padding:0 2px 0 12px;vertical-align:middle}
.rec{font-size:13px;color:#b4c7d1;margin-top:2px}
.rec b{color:#ffd9a8}
.newbest{color:var(--accent);font-weight:700}
.home .menu3{display:flex;flex-direction:column;gap:10px}
.mbtn{display:block;width:100%;text-align:center;font-weight:700;font-size:18px;letter-spacing:.2em;color:#fff;padding:15px 16px;border-radius:14px;
  background:rgba(14,24,34,.7);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mbtn:active{background:rgba(63,129,144,.8)}
.seg{display:flex;gap:8px;margin-top:8px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;background:var(--field);font-weight:700;font-size:15px;color:var(--ink)}
.seg button.on{background:var(--teal);color:#fff}
.sett .t{font-weight:700}
html[data-fs=l] .wrap{zoom:1.12}
html[data-fs=s] .wrap{zoom:.92}
html[data-fx=off] #fx,html[data-fx=off] .tree,html[data-fx=off] #stormB{display:none}
html[data-fx=weak] #fx{opacity:.55}
html[data-fx=weak] .tree{animation:none}
/* プロローグ */
html[data-screen=prologue] #hero,html[data-screen=prologue] .tree{display:none}
html[data-screen=prologue]:not([data-pro=storm]) #fx,html[data-screen=prologue]:not([data-pro=storm]) #stormB{display:none}
html[data-screen=prologue] .band{display:none}
html[data-screen=prologue] .wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:#24313a;margin-bottom:8px}
.rbar button{font-weight:700;color:#24313a;background:rgba(255,255,255,.7);border-radius:10px;padding:5px 10px;font-size:13px}
.rbar button[disabled]{opacity:.35}
.rbox{background:#fff;border-radius:14px;padding:14px 16px;margin-top:12px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.14);min-height:120px}
.rbox p{margin:0 0 8px}
.rbox.narr{background:rgba(255,255,255,.92);font-size:17px}
.rbox.tap{border:3px solid var(--teal-deep);height:176px;min-height:0;overflow:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rbox .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rbox .who b{color:var(--teal-deep)}
.rrole{font-size:12px;font-weight:700;color:var(--teal-deep);letter-spacing:.06em}
.rcard{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rcard:last-child{border-bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.two p{margin:4px 0;font-size:15px;line-height:1.5}
/* 時間の帯：現在の時刻を大きく、バーは左から右へ消費 */
.band{background:#101a24;border-bottom:1px solid rgba(255,255,255,.14)}
.band.warn,.band.hot{background:#101a24}
.band .nowt{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.band .nowt small{font-size:13px;font-weight:400;opacity:.75;margin-left:6px;letter-spacing:0}
.band .left{font-size:16px;font-weight:700;color:#cfe0e8;text-align:right}
.band .bar{height:16px;background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);border-radius:8px;margin-top:6px}
.band .bar i{background:linear-gradient(90deg,#5c0f1a,#a3192b);border-radius:8px;box-shadow:0 0 10px rgba(163,25,43,.55)}
.band.warn .bar i{background:linear-gradient(90deg,#7d1420,#d32a2a);box-shadow:0 0 12px rgba(211,42,42,.65)}
.band.hot .bar i{background:linear-gradient(90deg,#a01420,#ff2f2f);box-shadow:0 0 16px rgba(255,47,47,.85)}
.band .scale{display:flex;justify-content:space-between;font-size:11px;opacity:.7;margin-top:2px}
/* 書体：いかめしい明朝系。見出し・時刻・ボタンは太く */
body{font-weight:500}
h1,h2,.band .nowt,.band .left,.mbtn,.btn,.card .t,.rbox .who b,.ttl h1{font-weight:800}
.ttl h1{letter-spacing:.14em}
.band .nowt{letter-spacing:.04em}
button{font-family:inherit}
/* 戻る：ボタンとわかる形に／触れる所は指のカーソル */
[data-a],button,.card.tap,.note{cursor:pointer}
a.back{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:9px 16px 9px 12px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:15px;text-decoration:none;letter-spacing:.04em}
a.back:hover{background:rgba(255,255,255,.24)}
a.back:active{background:rgba(255,255,255,.32)}
.wrap>.back{color:#fff}
/* ノートは、題名と一行だけ。選んだものだけ全文 */
.note .b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;line-clamp:1;overflow:hidden}

}

function clueById(id){
  var found=null;
  CASE.places.forEach(function(p){ p.items.forEach(function(i){ if(i.clue.id===id) found=i.clue; }); });
  CASE.people.forEach(function(p){
    (p.clues||[]).forEach(function(c){ if(c.id===id) found=c; });
    (p.confront||[]).forEach(function(f){ (f.clues||[]).forEach(function(c){ if(c.id===id) found=c; }); });
  });

/* ---------- 絵の置き場（art\）と A/B の切り替え ----------
   A = このファイルの中の自作SVG（下の「絵」）。A以外 = art\<名前>.json（?art=b など）。
   json の値は <svg…> の文字列、または画像ファイルのパス（例 "art/c/sil_tome.png"）。名前は
   sil_<人物id> / scene_<場所id> / storm_rain / storm_waves / storm_trees / storm_bolt */
var ART_SET=null, ART_CACHE={}, ART_LIST=['a','b'], ART='a';
(function(){
  var q=(location.search.match(/[?&]art=([a-z0-9]+)/)||[])[1], sv=null;
  try{ sv=localStorage.getItem('chuzai:art'); }catch(e){}
  ART=q||sv||'a';
})();
function setArt(a){
  ART=a; document.documentElement.setAttribute('data-art',a);
  try{ localStorage.setItem('chuzai:art',a); }catch(e){}
  var go=function(){ ART_SET=ART_CACHE[a]||null; applyStormB(); if(window.__render) window.__render(); labelArt(); };
  if(a!=='a' && !ART_CACHE[a]){
    fetch('art/'+a+'.json').then(function(r){ return r.json(); }).then(function(j){ ART_CACHE[a]=j; go(); })
      .catch(function(){ ART='a'; document.documentElement.setAttribute('data-art','a'); toast('「'+a.toUpperCase()+'」の絵を読めませんでした'); go(); });
  } else go();
}
function nextArt(){ var i=ART_LIST.indexOf(ART); return ART_LIST[(i+1)%ART_LIST.length]; }
function labelArt(){ $('artsw').innerHTML='絵：<b>'+ART.toUpperCase()+'版</b> ⇄'; }
function bSvg(name, par){
  var t=ART_SET && ART_SET[name]; if(!t) return null;
  if(t.charAt(0)==='<') return par ? t.replace(/^<svg\b/, '<svg preserveAspectRatio="'+par+'"') : t;
  return '<img class="artimg" src="'+esc(t)+'" alt="">';
}
function applyStormB(){
  var on = ART!=='a' && ART_SET && ART_SET.storm_rain;     // 雨の絵があるときだけ、嵐も差し替える
  document.documentElement.setAttribute('data-storm', on?'b':'a');
  if(!on) return;
  $('sbRain').innerHTML=bSvg('storm_rain','xMidYMid slice')||'';
  $('sbWaves').innerHTML=bSvg('storm_waves','none')||'';
  $('sbTl').innerHTML=bSvg('storm_trees','xMidYMax meet')||''; $('sbTr').innerHTML=bSvg('storm_trees','xMidYMax meet')||'';
  $('sbBolt').innerHTML=bSvg('storm_bolt','xMidYMin meet')||'';
}
function stormBOn(){ return document.documentElement.getAttribute('data-storm')==='b'; }
function stormBLevel(inten){
  if(!stormBOn()) return;
  $('sbRain').style.opacity=inten<=0?0:Math.min(1,.25+inten*.9);
  $('sbWaves').style.opacity=inten<=0?.35:.9;
}
function boltB(){
  var b=$('sbBolt'); if(!stormBOn()||!b.innerHTML) return;
  b.style.left=(Math.random()*(window.innerWidth-90))+'px'; b.classList.add('on'); setTimeout(function(){ b.classList.remove('on'); },260);
}

function silSvg(sp, mode){
  sp=sp||{}; var bg=sp.bg||'#5b7a8c', id='g'+Math.floor(Math.random()*1e6);
  var vb = mode==='banner' ? '-120 0 360 140' : '0 0 120 124';
  var bx = mode==='banner' ? -120 : 0, bw = mode==='banner' ? 360 : 120, bh = mode==='banner' ? 140 : 124;
  return '<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMax slice" aria-hidden="true">'+
    '<defs><radialGradient id="'+id+'" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient></defs>'+

var C_BG=['light','school','clinic','hall','harbor','office','inn','beach'];

function personArt(p,mode){ var b=(ART!=='a')&&bSvg('sil_'+p.id, mode==='banner'?'xMidYMid meet':'xMidYMid slice'); if(b) return b; if(C_SIL.indexOf(p.id)>=0) return '<img class="artimg" src="art/c/sil_'+p.id+'.svg" alt="">'; return silSvg(p.sil,mode); }
function avatar(p){ return (ART!=='a')&&bSvg('sil_'+p.id) ? '<div class="av">'+personArt(p,'avatar')+'</div>' : p.sil ? '<div class="av">'+personArt(p,'avatar')+'</div>' : '<div class="mark">'+esc(p.mark)+'</div>'; }

function inProgress(){
  var last=null, best=null; try{ last=localStorage.getItem('chuzai:last'); }catch(e){}
  playable().forEach(function(c){ var sv=load(c.id); if(sv && !sv.finished && (!best || c.id===last)) best=c; });
  return best;
}

var KIDS={id:'kids',name:'子どもたち',sil:{bg:'#9bb59a',body:'slim',hair:'short'}};
var YOUP={id:'you',name:'駐在',sil:{bg:'#6f8fa6',body:'stout',hair:'short',hat:'police'}};
var CVL={};
function spkr(n){
  if(n==='駐在') return YOUP;
  if(n==='ほたる') return Object.assign({name:'ほたる'},HOTARU);
  if(n==='子どもたち') return KIDS;
  if(n==='ひなた') return {id:'hinata',name:'ひなた',sil:{bg:'#9bb59a',body:'slim',hair:'short'}};
  var map={'洲崎':'iwasaki','磯村':'shimura','汐田':'minato','トメ':'tome'};
  var pp=(CASE.people||[]).filter(function(x){ return x.id===map[n]; })[0];
  return pp ? Object.assign({},pp,{name:n}) : {name:n,sil:KIDS.sil};
}
function cvLines(p, text){
  var L=[], li=[];
  function flush(){ if(li.length){ L.push({k:'li',t:li.map(esc).join('<br>')}); li=[]; } }
  String(text).split('\n').forEach(function(l){
    l=l.trim(); if(!l) return;
    if(l.charAt(0)==='・'){ li.push(l); return; }
    flush();
    var im=l.match(/^\[\[img:(.+)\]\]$/); if(im){ L.push({k:'img',t:'<img src="'+esc(im[1])+'" alt="">'}); return; }
    var who=p, m=l.match(/^(駐在|ほたる|子どもたち|ひなた|洲崎|磯村|汐田|トメ)「/);
    if(m){ who=spkr(m[1]); l=l.slice(m[0].length-1); }
    if(l.charAt(0)==='「'){
      l=l.replace(/^「/,'').replace(/」$/,'');
      splitJa(l,56).forEach(function(c){ L.push({k:'say',n:esc((who&&who.name)||''),av:personArt(who||YOUP,'avatar'),t:esc(c)}); });
    } else splitJa(l,70).forEach(function(c){ L.push({k:'nar',t:esc(c)}); });
  });
  flush();
  return L;
}
function cvStack(L){
  return L.map(function(x){
    if(x.k==='say') return '<div class="cv"><div class="av">'+x.av+'</div><div class="bb"><div class="nm">'+x.n+'</div>'+x.t+'</div></div>';
    return '<div class="cv nar"><div class="bb'+(x.k==='li'?' li':'')+'">'+x.t+'</div></div>';
  }).join('');
}
function advInner(L, i){
  var x=L[i], last=(i===L.length-1);
  return '<div class="lgbox"></div><div class="advav">'+(x.k==='say'?'<div class="av">'+x.av+'</div><span class="who">'+x.n+'</span>':'')+'<div class="bt"><button class="bkb" type="button"'+(i===0?' disabled':'')+'>‹ もどる</button><button class="lgb" type="button">ログ</button></div></div>'+
    '<div class="advwin'+(x.k==='say'?'':' nar')+'"><div class="tx">'+x.t+'</div>'+
    '</div>';
}
function convo(p, text, key, quiet){
  var L=cvLines(p,text);
  if(!key) return cvStack(L);
  S.read=S.read||{};
  CVL[key]=L;
  var q=quiet?' cvq" data-q="1':'';
  if(S.read[key]||L.length<1) return '<div class="cvw done cvq" data-k="'+key+'"></div>';
  return '<div class="cvw adv'+q+'" data-k="'+key+'" data-i="0">'+advInner(L,0)+'</div>';
}
function cvAdvance(){
  var w=document.querySelector('#main .cvw:not(.done)'); if(!w) return false;
  var k=w.getAttribute('data-k'), L=CVL[k], i=(+w.getAttribute('data-i'))+1;
  if(!L){ w.classList.add('done'); return true; }
  if(i<L.length){
    w.setAttribute('data-i',i); w.innerHTML=advInner(L,i);
    
  } else {
    UI.snap=null;
    if(w._home&&w._home.parentNode){ w._home.parentNode.replaceChild(w,w._home); (w._gated||[]).forEach(function(n){ n.classList.remove('gated'); }); }
    w.classList.add('done'); w.classList.remove('adv'); w.innerHTML=''; w.classList.add('cvq');
    S.read=S.read||{}; S.read[k]=1; save();
    try{ w.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){}
  }
  return true;
}

  });

function qLocked(q){
  if(S.timeUp) return false;
  return !q.needs.every(function(n){ return S.insights.indexOf(n)>=0; });
}
function haveItem(x){ return S.clues.indexOf(x)>=0 || S.insights.indexOf(x)>=0; }
function pairsOf(i){ return [[i.a,i.b]].concat(i.alts||[]); }
function qById(id){ return CASE.questions.filter(function(q){ return q.id===id; })[0]; }
function stepDone(st){ return st.type==='ins' ? S.insights.indexOf(st.ref)>=0 : !!S.solved[st.ref]; }
function stepReady(st){
  if(st.type==='ins') return pairsOf(insightById(st.ref)).some(function(p){ return haveItem(p[0])&&haveItem(p[1]); });
  return S.timeUp || qById(st.ref).needs.every(function(n){ return S.insights.indexOf(n)>=0; });
}
function curStep(){ return (CASE.steps||[]).filter(function(st){ return !stepDone(st) && stepReady(st); })[0]; }
function themeCands(theme){
  var out=[];
  CASE.insights.filter(function(i){ return i.theme===theme; }).forEach(function(i){
    pairsOf(i).forEach(function(p){ p.forEach(function(x){ if(haveItem(x) && out.indexOf(x)<0) out.push(x); }); });
  });
  return out;
}
function curAct(){ return (CASE.acts||[])[S.ps||0]; }
function viewActs(){ return viewDeduce(); }
function pCards(){ return S.clues.map(clueById).filter(function(c){ return c && !c.of; }); }
function pWrong(a){ return (UI.wr&&UI.wr.id===a.id) ? convo(null,UI.wr.text,UI.wr.k,true) : ''; }
function pEvidence(a){
  var h='<h2>'+esc(a.prompt)+'</h2>';
  pCards().forEach(function(c){ h+='<button class="note" data-a="pev" data-v="'+c.id+'"><div class="t">'+esc(c.title)+'</div></button>'; });
  return h+pWrong(a);
}
function pBlank(a){
  var st=(UI.bl&&UI.bl.id===a.id)?UI.bl.s:[-1,-1];
  var h='<img class="blimg" src="art/c/footprints.png" alt="">';
  h+='<div class="blk">'+esc(a.pre)+'<b class="bl">'+(st[0]>=0?esc(a.slots[0][st[0]]):'＿＿')+'</b>'+esc(a.mid)+'<b class="bl">'+(st[1]>=0?esc(a.slots[1][st[1]]):'＿＿')+'</b>'+esc(a.post)+'</div>';
  [0,1].forEach(function(g){
    h+='<div>';
    a.slots[g].forEach(function(t,k){ h+='<button class="choice'+(st[g]===k?' sel':'')+'" style="display:inline-block;width:auto;margin:4px 6px 4px 0;padding:8px 14px" data-a="pbl" data-g="'+g+'" data-v="'+k+'">'+esc(t)+'</button>'; });
    h+='</div>';
  });
  h+='<button class="btn warm" data-a="pbs" style="margin-top:12px"'+((st[0]>=0&&st[1]>=0)?'':' disabled')+'>これだ</button>';
  return h+pWrong(a);
}
function pPick(a){
  var h='<h2>'+esc(a.prompt)+'</h2>';
  a.options.forEach(function(o){ h+='<button class="choice" data-a="ppick" data-v="'+o.id+'">'+esc(o.label)+'</button>'; });
  return h+pWrong(a);
}
function viewDeduce(){
  var acts=CASE.acts||[], i=S.ps||0, h='<h1 style="font-size:22px">推理</h1>';
  var sums=acts.slice(0,i).filter(function(a){ return a.sum; });
  if(sums.length) h+='<div style="margin:6px 0 10px">'+sums.map(function(a){ return '<div class="dsum">○ '+esc(a.sum)+'</div>'; }).join('')+'</div>';
  if(i>=acts.length) return h+'<p class="lock">推理は、ここまでです。</p>';
  var a=acts[i];
  var miss=(a.needs||[]).filter(function(n){ return S.clues.indexOf(n)<0; });
  if(miss.length){
    var nd=(CASE.nudges||[]).filter(function(x){ return x.need===miss[0]; })[0];
    return h+convo(null,'まだ、材料が足りません。'+(nd?'\nほたる「'+nd.say+'」':''),'nud:'+miss[0]+':'+(UI.nk||(UI.nk=Date.now())),true);
  }
  var k='a:'+a.id;
  if(a.t==='say'){
    return h+convo(null,a.lines,k+':s',true)+'<button class="btn" data-a="pnext">'+(i===acts.length-1?'おわり':'つぎへ')+'</button>';
  }
  if(a.lead) h+=convo(null,a.lead,k+':l',true);
  if(!(S.pa&&S.pa[a.id])){
    return h+(a.t==='evidence'?pEvidence(a):a.t==='blank'?pBlank(a):pPick(a));
  }
  return h+convo(null,a.expl,k+':e',true)+'<button class="btn" data-a="pnext">つぎへ</button>';
}

function viewEnd(){
  return '<h1 style="text-align:center;margin-top:10px">'+esc(CASE.ending.title)+'</h1><div class="story" style="margin-top:16px">'+
    (CASE.ending.text||[]).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join('')+'</div>'+
    '<div class="card" style="text-align:center"><b class="stamp">✓ 解決ずみ</b></div>'+
    '<button class="btn" data-a="again">もう一度</button><div style="height:10px"></div><button class="btn ghost" data-a="goCont">話の一覧へ</button>';
}

/* ---------- 操作 ---------- */
function loadCase(id, cb){
  var meta=INDEX.cases.filter(function(c){ return c.id===id; })[0];
  fetch('cases/'+meta.file).then(function(r){ return r.json(); }).then(function(j){ CASE=j; cb(); })
   .catch(function(){ toast('事件ファイルを読めませんでした'); });
}
function endPro(){
  document.documentElement.removeAttribute('data-pro');
  if(PRO && PRO.mode==='intro'){ UI.screen='play'; UI.tab='look'; UI.place=null; UI.person=null; render(); window.scrollTo(0,0); return; }
  startCase((PRO&&PRO.next)||'case01');
}
function startCase(v){ loadCase(v, function(){ S=fresh(); save(); UI.sel=[]; UI.place=null; UI.person=null; UI.lastBad={}; UI.msg={}; startPrologue('case01_intro'); }); }
var actions = {
  proLog: function(){
    var d=document.createElement('div'); d.className='prolog'; var h='<button class="x" type="button">とじる</button><div style="clear:both"></div>';
    PRO_PAGES.slice(0,PRO_I+1).forEach(function(P){ var g=P.pg; if(g.title||g.cards||g.list) return;
      if(g[0]==='n') h+='<p class="nr">'+esc(g[1])+'</p>'; else { var c=PRO_CAST[g[0]]||{name:g[0]}; h+='<p><b>'+esc(c.name)+'</b>'+esc(g[1])+'</p>'; } });
    d.innerHTML=h; d.addEventListener('click',function(){ d.remove(); }); document.body.appendChild(d); d.scrollTop=d.scrollHeight; return 'noop';
  },
  proNext: function(){ if(PRO_I>=PRO_PAGES.length-1){ endPro(); return 'async'; } PRO_I++; window.scrollTo(0,0); },
  proBack: function(){ if(PRO_I>0) PRO_I--; window.scrollTo(0,0); },
  proSkip: function(){ endPro(); return 'async'; },
  home: function(){ document.documentElement.removeAttribute('data-pro'); UI.screen='home'; window.scrollTo(0,0); },
  goCont: function(){ UI.screen='cont'; window.scrollTo(0,0); },
  goSet: function(){ $('overlay').innerHTML=''; UI.screen='settings'; window.scrollTo(0,0); },
  goNew: function(){ var c=playable()[0]; if(c) return actions.startnew(c.id,null,'pro'); },
  startnew: function(v, el, mode){
    var go=mode==='pro' ? function(){ startPrologue(); } : function(){ startCase(v); };
    var sv=load(v);
    if(sv && !sv.finished && sv.clues && sv.clues.length){
      window.__go=go;
      $('overlay').innerHTML='<div class="over"><div class="box"><h1 style="font-size:20px">最初から始める？</h1><p>この話の途中のデータは消えます。</p>'+
        '<button class="btn warm" data-a="goOk">最初から始める</button><div style="height:10px"></div><button class="btn ghost" data-a="closeover">やめる</button></div></div>';
      return 'noop';
    }
    go(); return 'async';
  },
  goOk: function(){ $('overlay').innerHTML=''; if(window.__go){ var g=window.__go; window.__go=null; g(); } return 'async'; },
  sett: function(v, el){ SETT[el.getAttribute('data-k')]=v; settSave(); applySett(); },
  wipe1: function(){
    $('overlay').innerHTML='<div class="over"><div class="box"><h1 style="font-size:20px">本当に消す？</h1><p>進み具合・クリアの印・設定がすべて消えます。元には戻せません。</p>'+
      '<button class="btn warm" data-a="wipe2">消す</button><div style="height:10px"></div><button class="btn ghost" data-a="closeover">やめる</button></div></div>';
    return 'noop';
  },
  wipe2: function(){
    try{ Object.keys(localStorage).filter(function(k){ return k.indexOf('chuzai:')===0; }).forEach(function(k){ localStorage.removeItem(k); }); }catch(e){}
    SETT={fs:'m',fx:'on'}; applySett(); S=null; $('overlay').innerHTML=''; UI.screen='home'; toast('保存データを消しました');
  },
  start: function(v){ loadCase(v, function(){
      var sv=load(v);
      if(sv && !sv.finished){ S=sv; UI.screen='play'; UI.tab='look'; UI.place=null; UI.person=null; }
      else { S=fresh(); save(); startPrologue('case01_intro'); return; }
      render();
  }); return 'async'; },
  begin: function(){ S=fresh(); save(); UI.screen='play'; UI.tab='look'; UI.place=null; UI.person=null; },
  again: function(){ S=fresh(); save(); UI.newBest=[]; UI.sel=[]; UI.place=null; UI.person=null; UI.lastBad={}; UI.msg={}; startPrologue('case01_intro'); return 'async'; },
  tab: function(v){ UI.nk=0; UI.sel=[]; UI.tab=v; UI.place=null; UI.person=null; UI.showShow=false; UI.msg={}; window.scrollTo(0,0); },
  place: function(v){ UI.place=v||null; window.scrollTo(0,0); },
  person: function(v){ UI.person=v||null; UI.showShow=false; UI.msg={}; window.scrollTo(0,0); },
  item: function(v){
    if(S.timeUp) return;
    var it=null; CASE.places.forEach(function(p){ p.items.forEach(function(i){ if(i.id===v) it=i; }); });
    if(S.seen[v]){ S.read=S.read||{}; S.read['i:'+v]=0; save(); return; }
    S.seen[v]=true; var added=addClue(it.clue);
    spend(it.cost); save();
  },
  retalk: function(){ S.read=S.read||{}; S.read['t:'+UI.person]=0; save(); },
  talk: function(v){
    if(S.timeUp || S.talked[v]) return;
    var p=CASE.people.filter(function(x){ return x.id===v; })[0];
    S.talked[v]=true; (p.clues||[]).forEach(addClue);
    spend(p.cost); save();
  },
  showon: function(){ UI.showShow=true; },
  showoff: function(){ UI.showShow=false; },
  show: function(v){
    if(UI.pending) return 'noop';
    var p=CASE.people.filter(function(x){ return x.id===UI.person; })[0];
    UI.pending=v; UI.msg={}; render();          // 押した瞬間：「…」で反応
    setTimeout(function(){
      UI.pending=null;
      var key=p.id+':'+v, f=(p.confront||[]).filter(function(x){ return x.with===v; })[0];
      var title=clueById(v).title, n=S.shown?Object.keys(S.shown).length:0;
      S.shown=S.shown||{};
      UI.msg={ who:'「'+title+'」を見せた' };
      if(f && !S.conf[key]){
        S.conf[key]=true; S.shown[key]=true; (f.clues||[]).forEach(addClue);
        UI.showShow=false; UI.msg={};
      } else if(S.shown[key]){
        if(S.conf[key]){ S.read=S.read||{}; S.read['c:'+key]=0; UI.showShow=false; UI.msg={}; }
        else { UI.msg.person=1; UI.msg.line='「それなら、さっき見せてもらったよ」'; UI.msg.k='m:'+Date.now(); }
      } else {
        UI.msg.person=1; UI.msg.line='駐在「（これは、この人に見せても仕方がなさそうだ。やめておこう）」'; UI.msg.k='m:'+Date.now();
      }
      save(); render();
      
    }, 450);
    return 'noop';
  },
  sel: function(v){
    var i=UI.sel.indexOf(v);
    if(i>=0) UI.sel.splice(i,1); else { if(UI.sel.length>=2) UI.sel.shift(); UI.sel.push(v); }
    UI.msg.join='';
  },
  join: function(){
    if(UI.sel.length!==2) return;
    var a=UI.sel[0], b=UI.sel[1], st=curStep(); if(!st||st.type!=='ins') return;
    var theme=insightById(st.ref).theme;
    var rem=CASE.insights.filter(function(i){ return i.theme===theme && S.insights.indexOf(i.id)<0; });
    var hit=rem.filter(function(i){ return pairsOf(i).some(function(p){ return (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a); }); })[0];
    if(hit){ S.insights.push(hit.id); UI.sel=[]; UI.msg.join=''; UI.hint={}; toast('ひらめき：'+hit.title); save(); return; }
    var useful=function(x){ return rem.some(function(i){ return pairsOf(i).some(function(p){ return p[0]===x||p[1]===x; }); }); };
    var ua=useful(a), ub=useful(b);
    UI.msg.join = ua&&ub ? 'どちらも使えそう。ただ、この2つではない。' : (ua||ub) ? '片方は、ほかの何かとつながりそう。' : 'この2つは、あまり関係がなさそう。';
  },
  pev: function(v){
    var a=curAct(); if(!a||a.t!=='evidence') return;
    if((a.ok||[]).indexOf(v)>=0){ S.pa=S.pa||{}; S.pa[a.id]=true; UI.wr=null; save(); return; }
    UI.wr={ k:'w:'+Date.now()+Math.random(), id:a.id, text:(a.wrong&&a.wrong[v])||(a.wrong&&a.wrong._)||'ほたる「それが、どう関係あるんですか？」' };
  },
  pbl: function(v, el){
    var a=curAct(); if(!a||a.t!=='blank') return;
    if(!UI.bl||UI.bl.id!==a.id) UI.bl={ id:a.id, s:[-1,-1] };
    UI.bl.s[+el.getAttribute('data-g')]=+v; UI.wr=null;
  },
  pbs: function(){
    var a=curAct(); if(!a||a.t!=='blank'||!UI.bl) return;
    var key=UI.bl.s[0]+'|'+UI.bl.s[1];
    if(key===a.ok){ S.pa=S.pa||{}; S.pa[a.id]=true; UI.wr=null; UI.bl=null; save(); return; }
    UI.wr={ k:'w:'+Date.now()+Math.random(), id:a.id, text:(a.combos&&a.combos[key])||a.wrong };
  },
  ppick: function(v){
    var a=curAct(); if(!a||a.t!=='pick') return;
    if(v===a.ok){ S.pa=S.pa||{}; S.pa[a.id]=true; UI.wr=null; save(); return; }
    UI.wr={ k:'w:'+Date.now()+Math.random(), id:a.id, text:(a.replies&&a.replies[v])||a.wrong };
  },
  pnext: function(){
    S.ps=(S.ps||0)+1; UI.wr=null; UI.bl=null; save(); window.scrollTo(0,0);
    if(S.ps>=(CASE.acts||[]).length){ finish(); UI.screen='end'; }
  },
  memo: function(v){ UI.open=UI.open||{}; UI.open[v]=!UI.open[v]; },
  dhint: function(v){ UI.hint=UI.hint||{}; UI.hint[v]=true; },
  ans: function(v, el){
    var q=CASE.questions.filter(function(x){ return x.id===el.getAttribute('data-q'); })[0];
    var c=q.choices[+v];
    if(c.ok){
      S.solved[q.id]=true; UI.lastBad[q.id]=null; save();
      toast('○ 正解！');
      if(CASE.questions.every(function(x){ return S.solved[x.id]; })){ finish(); setTimeout(function(){ UI.screen='end'; render(); }, 1200); }
    } else { UI.lastBad[q.id]=+v; }
  },
  hint: function(v, el){
    var id=el.getAttribute('data-q'); S.hints[id]=(S.hints[id]||0)+1; save();
  },
  closeover: function(){ $('overlay').innerHTML=''; },
  hotaru: function(){
    var L=['ほたる「'+hotaruSay()+'」'];
    var done=(CASE.acts||[]).slice(0,S.ps||0).filter(function(x){ return x.sum; });
    if(done.length){ L.push('ほたる「ここまでにわかったことです」'); done.forEach(function(x){ L.push('ほたる「'+x.sum+'」'); }); }
    UI.cw={text:L.join('\n'),k:'h:'+Date.now()};
  },
  menu: function(){
    $('overlay').innerHTML='<div class="over"><div class="box"><h1 style="font-size:20px;margin-bottom:12px">メニュー</h1>'+
      '<button class="btn ghost" data-a="closeover">つづける</button><div style="height:10px"></div>'+
      '<button class="btn ghost" data-a="goSet">設定</button><div style="height:10px"></div>'+
      '<button class="btn ghost" data-a="menuhome">タイトルへ（進み具合は残る）</button><div style="height:10px"></div>'+
      '<button class="btn warm" data-a="restart1">最初からやり直す</button></div></div>';
    return 'noop';
  },
  menuhome: function(){ $('overlay').innerHTML=''; UI.screen='home'; },
  restart1: function(){
    $('overlay').innerHTML='<div class="over"><div class="box"><h1 style="font-size:20px">最初からやり直す？</h1>'+
      '<p>いまの捜査（手がかり・ひらめき・時間）は消えます。クリアの記録とベストは残ります。</p>'+
      '<button class="btn warm" data-a="restart2">やり直す</button><div style="height:10px"></div><button class="btn ghost" data-a="closeover">やめる</button></div></div>';
    return 'noop';
  },
  restart2: function(){ $('overlay').innerHTML=''; S=fresh(); save(); UI.sel=[]; UI.place=null; UI.person=null; UI.lastBad={}; UI.msg={}; UI.screen='play'; UI.tab='look'; }
};

/* 1文字ずつ表示 */
var TW=null;
function twDone(){ if(!TW) return false; clearInterval(TW.id); TW.el.textContent=TW.full; TW=null; return true; }
function twStart(el){
  if(el.getAttribute('data-tw')) return; el.setAttribute('data-tw','1');
  if(el.children.length) return;
  var full=el.textContent; if(!full) return; var n=0;
  function paint(){ el.textContent=''; el.appendChild(document.createTextNode(full.slice(0,n))); var h=document.createElement('span'); h.style.visibility='hidden'; h.textContent=full.slice(n); el.appendChild(h); }
  twDone(); paint();
  TW={el:el,full:full,id:setInterval(function(){ n++; if(n>=full.length){ twDone(); } else paint(); },32)};
}
var IDLE={look:'気になる場所を、調べてみよう。',people:'話を聞きたい人を、選んでみよう。',notes:'集めた手がかりを、見返してみよう。',deduce:'手がかりを手に、推理を進めよう。'};
function cwSync(){
  var idleT=S&&S.timeUp?'夜が明けた。もう新しく調べたり、話を聞いたりはできない。ノートの手がかりで推理しよう。':null;
  var m=$('main'); if(UI.screen!=='play'||!IDLE[UI.tab]) return;
  var slot=document.getElementById('cwin');
  if(!slot){ slot=document.createElement('div'); slot.id='cwin'; m.insertBefore(slot,m.firstChild); }
  else if(slot!==m.firstChild) m.insertBefore(slot,m.firstChild);
  var all=[].slice.call(m.querySelectorAll('.cvw.adv')), cur=slot.querySelector('.cvw.adv');
  if(!cur && all.length){
    cur=all[0]; cur.classList.remove('waiting');
    var home=document.createElement('span'); home.className='cvhome'; cur.parentNode.insertBefore(home,cur); cur._home=home;
    slot.innerHTML=''; slot.appendChild(cur);
  }
  all.forEach(function(x){ if(x!==cur && x.parentNode!==slot) x.classList.add('waiting'); });
  m.classList.toggle('cvon',!!cur);
  if(cur) return;
  if(!slot.querySelector('.idlewin')){ slot.innerHTML='<div class="idlewin"><div class="advwin nar"><div class="tx">'+(idleT||IDLE[UI.tab])+'</div></div></div>'; }
}
new MutationObserver(function(){ cwSync(); var el=document.querySelector('#main .advwin .tx, #main .rbox.tap p'); if(el) twStart(el); }).observe($('main'),{childList:true,subtree:true});
document.addEventListener('click', function(e){
  if(TW && !TW.el.isConnected){ twDone(); } if(TW && e.target.closest('.advwin,.rbox.tap') && !e.target.closest('.lgb')){ twDone(); e.stopPropagation(); return; }
  var bk=e.target.closest('.bkb'); if(bk){ if(!bk.disabled) cvBack(bk); return; }
  var lg=e.target.closest('.lgb'); if(lg){ cvLog(lg); return; }
  var rd=e.target.closest('.rdb'); if(rd){ cvReread(rd); return; }
  if(e.target.closest('.lgbox,.rdbox')) return;
  if(UI.screen==='play' && (UI.tab==='look'||UI.tab==='people'||UI.tab==='deduce') && e.target.closest('.cvw.adv .advwin') && !e.target.closest('[data-a],a,button,#nav,#overlay') && cvAdvance()) return;
  var el=e.target.closest('[data-a]'); if(!el || el.disabled) return;
  if($('main').classList.contains('cvon') && el.closest('#main') && !el.closest('#cwin') && !el.closest('.back')) return;
  var a=el.getAttribute('data-a'), fn=actions[a]; if(!fn) return;
  if((a==='tab'||a==='person'||a==='place'||a==='menu') && UI.snap){
    if(document.querySelector('#main .cvw.adv')){ try{ S=JSON.parse(UI.snap); save(); }catch(err){} }
    UI.snap=null;
  }
  if(a==='item'||a==='talk'||a==='retalk'||a==='show'){ try{ UI.snap=JSON.stringify(S); }catch(err){ UI.snap=null; } }
  if(a!=='hotaru') UI.cw=null;
  e.preventDefault();
  var r=fn(el.getAttribute('data-v'), el);
  if(r!=='async' && r!=='noop') render();
});

 .catch(function(){ $('main').innerHTML='<p>事件ファイルを読み込めませんでした。インターネットにつないで開き直してください。</p>'; });

document.documentElement.setAttribute('data-art',ART); labelArt();

if(ART!=='a') setArt(ART);
$('main').innerHTML='<p class="muted">読み込み中…</p>';
