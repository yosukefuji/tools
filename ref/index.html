<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563C9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="診療メモ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>診療メモ</title>
<style>/* 診療ツール 共通の型（全アプリ同じ。--c だけアプリごと） */
:root{--bg:#f3f4f7;--card:#fff;--ink:#1b1f27;--muted:#6b7280;--line:#e3e6ec;
 --font:-apple-system,"Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
.top{background:var(--c);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px}
.top .in,.main{max-width:560px;margin:0 auto}
.brand{font-size:11px;letter-spacing:.14em;opacity:.8;font-weight:700}
.title{display:flex;align-items:center;gap:10px;margin-top:4px;min-height:30px}
.title h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.02em}
.back{color:#fff;text-decoration:none;font-size:15px;opacity:.9;white-space:nowrap}
.main{padding:14px 16px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.q{padding:12px 16px;font-size:20px;line-height:1.4;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-left:5px solid var(--c);margin-bottom:6px;letter-spacing:.04em}
.q em{font-style:normal;color:var(--c)}
.row{display:flex;gap:12px;align-items:baseline;padding:9px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.q+.row{border-top:0}
.row .k{flex:0 0 36%;color:var(--ink)}
.row .v{flex:1}
.big{font-size:19px;font-weight:800;color:var(--c);white-space:nowrap}
.b{font-weight:800;color:var(--c)}
.note{padding:4px 16px 12px;font-size:12.5px;color:var(--muted);line-height:1.6}
.nb{white-space:nowrap}
.sec{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em;margin:20px 4px 8px}
.list a{display:block;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.list a:first-child{border-top:0}
.list .n{font-size:17px;font-weight:800;display:flex;justify-content:space-between}
.list .n::after{content:"›";color:var(--c);font-size:20px;line-height:1}
.list .s{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.list .s b{color:var(--c)}
.fold{padding:13px 16px;border-top:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;color:var(--ink)}
.fold:first-child{border-top:0}
.fold::after{content:"＋";color:var(--c);font-weight:800}
.foot{font-size:11.5px;color:var(--muted);line-height:1.7;margin:18px 4px 0}
/* 入力（計算アプリ） */
.lbl{font-size:13px;font-weight:700;color:var(--muted);padding:12px 16px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14.5px}
.chip.on{border-color:var(--c);color:var(--c);font-weight:800;background:color-mix(in srgb,var(--c) 8%,#fff)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 14px}
.f .t{font-size:13px;font-weight:700}.f .u{font-size:11px;color:var(--muted)}
.f .box{margin-top:4px;height:46px;border-radius:10px;background:#f1f3f7;border:1.5px solid var(--line);font-size:20px;font-weight:800;display:flex;align-items:center;padding:0 10px}
.ans{background:var(--c);color:#fff;border-radius:14px;padding:14px 16px;margin:0 0 12px}
.ans .t{font-size:12px;opacity:.85;font-weight:700;letter-spacing:.06em}
.ans .v{font-size:30px;font-weight:800;margin-top:2px}
.ans .s{font-size:13.5px;opacity:.92;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.q+.two{border-top:0}
.two>div{padding:8px 14px 12px;font-size:14.5px;line-height:1.55}
.two>div+div{border-left:1px solid var(--line)}
.two .h{font-size:12.5px;font-weight:800;margin-bottom:4px}
.yes .h{color:var(--c)} .no .h{color:#9a3b2a}
.two ul{margin:0;padding:0;list-style:none}.two li{margin:2px 0}
.small{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:2px 16px 12px}
.tag{font-size:13.5px;font-weight:700;border-radius:8px;padding:3px 9px;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c)}
.ev{border-top:1px solid var(--line)}
.ev summary{list-style:none;padding:10px 16px;font-size:13.5px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;cursor:pointer}
.ev summary::-webkit-details-marker{display:none}
.ev summary::after{content:"＋";color:var(--c)}
.ev[open] summary::after{content:"－"}
.ev .in{padding:0 16px 12px;font-size:13px;line-height:1.65;color:#3b4150}
.ev .in p{margin:0 0 6px}
.ev .in .src{font-size:11.5px;color:var(--muted)}
.gl{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);background:#eef0f4;border-radius:5px;padding:0 6px;margin-left:2px}
.toc{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.toc a{flex:1;text-align:center;font-size:14px;font-weight:800;color:var(--c);background:#fff;border:1.5px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:999px;padding:7px 0;text-decoration:none;white-space:nowrap}
.go{display:flex;justify-content:space-between;align-items:center;margin:12px 16px;padding:14px 16px;border-radius:12px;background:#5B4BC4;color:#fff;font-size:17px;font-weight:800;text-decoration:none}
.go::after{content:"›";font-size:24px;line-height:1}

html{scroll-behavior:smooth}.card[id],.part[id]{scroll-margin-top:62px}.back{display:inline-block;padding:6px 12px 6px 0;margin:-6px 0;font-size:24px;line-height:1}.list a{color:var(--ink)}.foot{margin-bottom:24px}.main,.q{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}html{background:var(--c)}body{background:var(--bg);min-height:100vh}</style>
<style>:root{--c:#2563C9}</style>
</head>

</html>
